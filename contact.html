<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Berkshire+Swash&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <title>Contact Me</title>
</head>

<body>

    <header>
        <h1>Ane Chelsey S. Alino</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="skills.html">Skills</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section class="contact-section">

            <h2>Let's Get in Touch!</h2>

            <form class="contact-card">

                <p>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <p>
                    <label for="subject">Subject:</label>
                    <input type="text" id="subject" name="subject" required>
                </p>

                <p>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </p>

                <p>
                    <button type="submit">Send Message</button>
                </p>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Ane Chelsey S. Alino</p>
    </footer>

</body>

</html>
